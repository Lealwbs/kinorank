[project]
name = "kinorank"
version = "1.0.0"
description = "Hybrid Movie Recommendation System (Collaborative ALS + FAISS Semantic ANN + LightGBM LambdaRank + Agentic GenAI Reranker)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Ítalo Leal", email = "italoleallanasantos@gmail.com" }
]
dependencies = [
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0,<2.1.0",
    "scipy>=1.11.0",
    "implicit>=0.7.2",
    "faiss-cpu>=1.8.0",
    "lightgbm>=4.3.0",
    "scikit-learn>=1.4.0",
    "torch>=2.2.0",
    "sentence-transformers>=3.0.0",
    "pyspark>=3.5.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "gradio>=4.44.0",
    "huggingface-hub>=0.24.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "nbconvert>=7.16.0",
    "ipykernel>=6.29.0",
    "nbformat>=5.10.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "data",
    "artifacts",
    "notebooks",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
